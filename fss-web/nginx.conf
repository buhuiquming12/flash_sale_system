# =====================================================================
# 前端镜像里的 Nginx。它做两件事：发静态文件、把 /api 与 /actuator
# 反代到应用容器——和开发期 Vite proxy 的职责完全一样，
# 所以前端代码在两种模式下都不需要知道后端地址。
#
# 这里刻意<b>不</b>抄 docker/nginx/nginx.conf 的限流与缓存：
# 那份是四级限流的第一级，保护的是应用集群；这份只是演示前端的门面，
# 把限流写两遍会让"到底哪一层拦的"变成一个查不清的问题。
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。配上它并把上游写成变量，Nginx 就不在启动时解析 app——
    # 直接写 proxy_pass http://app:8080 时，app 容器还没起来会让 Nginx
    # 启动失败退出，而且应用重建换了 IP 之后 Nginx 会一直连旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location /api/ {
        set $upstream_app app:8080;
        # 用了变量的 proxy_pass 不会自动带上 URI，必须显式拼 $request_uri
        proxy_pass http://$upstream_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        # 秒杀提交与结果轮询都是短请求；给长了失败的请求会一直占着连接
        proxy_read_timeout    15s;
    }

    location /actuator/ {
        set $upstream_act app:8080;
        proxy_pass http://$upstream_act$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 带指纹的静态资源可以长缓存，index.html 绝不能——
    # 缓存了它就会在下次发版后继续加载已经不存在的 js 文件名
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # history 模式路由的回退。少了这一条，直接访问 /orders 会 404，
    # 而只有刷新页面时才会遇到——最容易漏测的一类问题
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
