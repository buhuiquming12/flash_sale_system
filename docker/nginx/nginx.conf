worker_processes auto;

events {
    # 秒杀场景下连接数是硬约束：worker_processes × worker_connections
    # 就是理论上限，给小了 Nginx 自己先成为瓶颈
    worker_connections 20480;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里带上限流状态与上游耗时，压测复盘时这两个字段最有用：
    # 没有它们就分不清"慢"是发生在 Nginx 排队还是上游处理
    log_format  fss  '$remote_addr - [$time_local] "$request" $status '
                     'rt=$request_time urt=$upstream_response_time '
                     'ups=$upstream_addr limit=$limit_req_status';
    access_log  /var/log/nginx/access.log  fss;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # ---- 第一级限流：Nginx ----
    # 单 IP 20 r/s。这一级拦掉的是爬虫与明显洪峰，它拦下的请求
    # 完全不消耗应用线程、不产生 Redis 调用，成本最低
    limit_req_zone $binary_remote_addr zone=perip:20m    rate=20r/s;
    # 全局 12000 r/s，保护整个集群
    limit_req_zone $server_name        zone=perserver:10m rate=12000r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # 活动详情缓存 3 秒。库存展示有 3 秒延迟完全可以接受，
    # 换来的是详情接口 QPS 降一到两个数量级
    proxy_cache_path /var/cache/nginx/activity levels=1:2
                     keys_zone=activity_cache:10m max_size=200m inactive=60s;

    upstream fss_web {
        server fss-web-1:8080 max_fails=2 fail_timeout=10s;
        server fss-web-2:8080 max_fails=2 fail_timeout=10s;
        # 复用到上游的连接。秒杀期间每秒上万请求，
        # 每次都新建 TCP + 三次握手是纯粹的浪费
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        location /api/seckill/ {
            # nodelay：突发请求立即处理而不是排队，超出直接 429。
            # 秒杀要的是快速失败——排队会占满连接，而用户等 30 秒才知道
            # 自己没抢到，体验比立刻告知"太火爆"更差
            limit_req zone=perip     burst=40   nodelay;
            limit_req zone=perserver burst=2000 nodelay;

            proxy_pass http://fss_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # XFF 只能从右往左信任：这里由 Nginx 追加真实 remote_addr 到最右侧，
            # 应用侧取最右一段（IpUtil.realIp）。取最左侧是常见错误，
            # 那一段完全由客户端控制，攻击者每次换一个伪造 IP 就绕过了 IP 限流
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            # 秒杀接口必须快，超时即失败。给 30s 只会让失败的请求
            # 继续占着连接和线程
            proxy_read_timeout    3s;
        }

        location /api/activity/ {
            limit_req zone=perip burst=100 nodelay;

            proxy_cache       activity_cache;
            proxy_cache_valid 200 3s;
            proxy_cache_key   "$uri$is_args$args";
            # 回源风暴防护：缓存过期瞬间只让一个请求打到上游，
            # 其余等它回来。这一层和应用内的逻辑过期缓存是同一个思路的两次实现，
            # 分别保护上游和数据库
            proxy_cache_lock  on;
            proxy_cache_lock_timeout 3s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://fss_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 支付回调不限流：来自渠道方固定的几个 IP，按 IP 限流必然误杀，
        # 而拦掉一次成功回调意味着用户付了钱订单没变
        location /api/pay/notify {
            proxy_pass http://fss_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=perip burst=100 nodelay;
            proxy_pass http://fss_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
