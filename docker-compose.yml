# =====================================================================
# 一份拓扑覆盖全部阶段，用 profiles 控制启停，不另起文件——
# 三份 compose 文件必然漂移，而漂移的那一处只会在部署当天暴露。
#
#   （默认）  mysql
#   phase2    redis
#   phase3    rocketmq namesrv + broker + 建 Topic
#   phase4    prometheus + grafana
#   phase5    nginx（多实例部署形态才有意义）
#   all       上面全部 + 应用容器 + 前端容器（一键演示）
#   sentinel  Redis 1 主 2 从 3 哨兵（叠加在 phase2 或 all 之上，见 redis 服务）
#
# 一键起整套（首次会构建应用与前端镜像，约 3~6 分钟）：
#   docker compose --profile all up -d --build
#   → 前端 http://localhost:8081   接口 http://localhost:8080
#
# 只起中间件、应用自己在宿主机 java -jar 跑（阶段四起的老流程）：
#   FSS_BROKER_IP=127.0.0.1 docker compose \
#       --profile phase2 --profile phase3 --profile phase4 up -d
#
# <b>FSS_BROKER_IP 必须显式设成 127.0.0.1</b>：broker 通过 namesrv 把自己的
# 地址告诉客户端，默认值 rocketmq-broker 只在容器网络里解析得到。
# 宿主机上的应用拿到这个名字会解析失败，症状是发送超时、秒杀永远停在"排队中"。
#
# 注意 down -v 时<b>必须带上全部 profile</b>，否则 compose 不认识那些服务，
# 它们的命名卷会留下来：redis-data 带着上一轮的 stock/bought 活到下一轮，
# 而 mysql-data 被删了、activityId 从 1 重新开始——两边一对上就是
# "库存莫名少了几个"。清干净的写法：
#   docker compose --profile all --profile phase5 down -v
#
# 起过哨兵的话 down 也要带上 --profile sentinel：那几个服务没有命名卷
# （理由见下方），但容器本身会留下来。
# =====================================================================
name: fss

services:
  mysql:
    image: mysql:8.0
    container_name: fss-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 必须与应用时区一致。容器默认 UTC，而应用用 Asia/Shanghai 写入
      # LocalDateTime，两者并存会让 NOW(3) 与列 DEFAULT 生成的时间比 Java
      # 写入的时间慢 8 小时——表现是订单创建时间、支付时间对不上，
      # 而 cancel_time 与 expire_time 的比较也会得出错误结论。
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=1
      - --long-query-time=0.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flash_sale
    volumes:
      # 容器首次启动时按文件名顺序执行 /docker-entrypoint-initdb.d 下的脚本。
      # 注意：只在数据卷为空时执行，改了 DDL 要 docker compose down -v 才会重跑。
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"        # 宿主 3306 常被本机 MySQL 占用，映射到 3307
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- 以下服务在对应阶段启用，用 profiles 控制，默认不启动 ----

  redis:
    image: redis:7.2-alpine
    container_name: fss-redis
    profiles: ["phase2", "all", "sentinel"]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      # 秒杀库存和用户购买标记绝不能被淘汰。用 allkeys-lru 时内存压力下
      # Redis 可能淘汰 seckill:stock，后续请求读到 0 直接导致业务错乱。
      # 宁可写入失败（noeviction 下写满会报错，能被监控发现），也不能静默丢数据。
      - --maxmemory-policy
      - noeviction
      # 下面两行是给<b>故障转移之后</b>准备的：这个容器一旦被降级成从库，
      # 客户端拿到的就是它通报的地址。容器名 + 容器内端口，与其余节点一致。
      # 它现在还是 master，这两行不生效——但少了它们，那个问题只在
      # 经历两次故障切换之后才暴露，属于最难查的一类
      - --replica-announce-ip
      - redis
      - --replica-announce-port
      - "6379"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================================================================
  # Redis 哨兵（profile: sentinel）
  #
  # 复用上面那个 redis 容器当 master，不另起一个 master 服务——那样会
  # 有两个容器抢 6379，而 compose 只会在启动时报端口冲突。
  #
  # <b>通告地址一律用容器名，因此客户端也必须在同一个 compose 网络里。</b>
  # 这不是图省事：Redis 哨兵对外只通告<b>一个</b>地址，而它要同时满足两方——
  # 哨兵自己得连得上（它要监控 master 和从库、要投票选主），客户端也得连得上。
  # 唯一的交集就是容器名。
  #
  # 实测过一次"通告改成 host.docker.internal"的写法，容器侧一切正常
  # （复制、监控、选主都成立），但宿主机上 java -jar 跑的应用拿到的
  # 是本机不可达的地址，启动直接失败：
  #   ConnectTimeoutException: connection timed out: host.docker.internal/10.107.11.3:26381
  #   SENTINEL SENTINELS command returns less than 2 nodes ...
  # 所以<b>应用要跑在容器里</b>：--profile all --profile sentinel。
  # 宿主机直接跑应用接哨兵这条路走不通，不是参数没调对——
  # host.docker.internal 在容器内好用（经 host-gateway 出去），
  # 在宿主机上却指向一个本机不可达的地址（Docker Desktop 写进 hosts 的那条）。
  #
  # 宿主端口 6380/6381/26379-26381 仍然发布，但只用于在宿主机上用 redis-cli
  # 直连排查。它们与通告出去的端口（6379 / 26379）不是一回事，
  # 别拿宿主机看到的端口去推断客户端会拿到什么。
  #
  # <b>演示时如果停了 master 却迟迟不选主，先看哨兵日志里有没有 +tilt。</b>
  # 系统时钟跳变、或哨兵自身事件循环被拖慢 2 秒以上时，哨兵会进入 TILT 模式
  # 并<b>暂停一切故障转移动作</b>。它是个保护机制（避免按一个错的时钟做决定），
  # 但代价就是选主被无限期搁置。这不是配置问题——TILT 的阈值是哨兵内部常量，
  # sentinel.conf 里配不了，能改的只有机器负载。
  #
  # Docker Desktop + WSL2 上尤其容易撞上：VM 时钟会漂，而机器同时跑着
  # MySQL(1GB) / RocketMQ / 应用 JVM 时，哨兵的事件循环还容易超时。
  # 实测两次：负载低时 +tilt 反复进出约 90 秒，之后 20 秒内完成选主；
  # 负载高时 +tilt 每 8 秒重复进入、两分钟仍未退出，选主始终没发生。
  # 演示前先把压测与集成测试停掉，或者接受"可能要等一两分钟"。
  #
  # 这期间应用侧的表现是对的，可以一并演示：Redis 真不可用时
  # /actuator/health 转 DOWN（503），秒杀请求 fail-closed 而不是打向 MySQL；
  # Redis 恢复后自动重连，实测三次探测内自愈，不需要重启应用。
  #
  # 这两个从库与三个哨兵<b>刻意不挂命名卷</b>，理由与 rocketmq-broker 相同：
  # 演示形态的数据不值得为它授挂载权限，而且不新增命名卷意味着
  # 文件头那条 down -v 的提示依然准确。
  # ==================================================================

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: fss-redis-replica-1
    profiles: ["sentinel"]
    depends_on:
      - redis
    command:
      - redis-server
      # 从库的这几个参数必须与 master 逐项一致：库存与用户购买标记绝不能
      # 被淘汰，否则故障转移之后接手的那个从库会静默丢 key
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --replicaof
      - redis
      - "6379"
      # 转正之后客户端拿到的就是这两个值。容器名 + 容器内端口，
      # 与哨兵、其余节点的通告保持一致（见上面的说明）
      - --replica-announce-ip
      - redis-replica-1
      - --replica-announce-port
      - "6379"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: fss-redis-replica-2
    profiles: ["sentinel"]
    depends_on:
      - redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --replicaof
      - redis
      - "6379"
      - --replica-announce-ip
      - redis-replica-2
      - --replica-announce-port
      - "6379"
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: fss-redis-sentinel-1
    profiles: ["sentinel"]
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    volumes:
      - ./docker/redis/sentinel.conf.tpl:/etc/redis/sentinel.conf.tpl:ro
    ports:
      - "26379:26379"
    # 模板 → 替换两个占位符 → 启动。这里 sed 进去的是字面量，不需要环境变量，
    # 因此也没有 broker 那处"$$ 转义"的坑：那几个值不随部署形态变化，
    # 而 broker 的 brokerIP1 会变，才必须绕一层环境变量
    command: sh -c 'sed -e "s|__MASTER_HOST__|redis|g" -e "s|__ANNOUNCE_IP__|redis-sentinel-1|g" /etc/redis/sentinel.conf.tpl > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel'
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "get-master-addr-by-name", "mymaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: fss-redis-sentinel-2
    profiles: ["sentinel"]
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    volumes:
      - ./docker/redis/sentinel.conf.tpl:/etc/redis/sentinel.conf.tpl:ro
    ports:
      - "26380:26379"
    command: sh -c 'sed -e "s|__MASTER_HOST__|redis|g" -e "s|__ANNOUNCE_IP__|redis-sentinel-2|g" /etc/redis/sentinel.conf.tpl > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel'
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "get-master-addr-by-name", "mymaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: fss-redis-sentinel-3
    profiles: ["sentinel"]
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    volumes:
      - ./docker/redis/sentinel.conf.tpl:/etc/redis/sentinel.conf.tpl:ro
    ports:
      - "26381:26379"
    command: sh -c 'sed -e "s|__MASTER_HOST__|redis|g" -e "s|__ANNOUNCE_IP__|redis-sentinel-3|g" /etc/redis/sentinel.conf.tpl > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel'
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "get-master-addr-by-name", "mymaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: fss-rmq-namesrv
    profiles: ["phase3", "all"]
    command: sh mqnamesrv
    # namesrv 默认要 -Xms4g，普通开发机上直接 OOM 起不来
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: fss-rmq-broker
    profiles: ["phase3", "all"]
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      # broker 注册到 namesrv 的自身地址，客户端拿到它之后直连。
      # 默认给容器名（应用也在容器里跑时用这个）；应用在宿主机上跑时
      # 必须 FSS_BROKER_IP=127.0.0.1，见文件头的说明
      FSS_BROKER_IP: "${FSS_BROKER_IP:-rocketmq-broker}"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    # broker.conf 是只读挂载的模板，启动时把 brokerIP1 那一行替换掉再用。
    # 为两种部署形态各留一份 broker.conf 会漂移，而漂移的那一行
    # （恰好是决定客户端能不能连上的那一行）只会在切换形态时暴露。
    # $$ 是给 compose 转义用的，容器里看到的是 $FSS_BROKER_IP
    command: sh -c 'sed "s|^brokerIP1 *=.*|brokerIP1 = $$FSS_BROKER_IP|" /home/rocketmq/conf/broker.conf > /tmp/broker.conf && exec sh mqbroker -c /tmp/broker.conf'
    # 刻意<b>不</b>给 store 挂命名卷。镜像里 /home/rocketmq/store 并不存在，
    # 挂上去 Docker 会新建一个 root 所有的空目录，而 broker 以 uid 3000 运行，
    # 写不进去 → 初始化失败。更糟的是 5.3.0 的失败路径本身有个 NPE
    # （ScheduleMessageService.configFilePath），真正的原因被那个 NPE 盖掉了，
    # 日志里只看到一句 NullPointerException。
    # 想持久化就得 user: root，为一个演示环境授这个权不值得——
    # 消息数据留在容器可写层，stop/start 保留，down 之后重建（连带 Topic 要重建）
    # 端口必须<b>固定映射</b>，不能让 Docker 随机分配。broker 通过 namesrv 把
    # 「brokerIP1:listenPort」告诉客户端，客户端拿到这个地址后直连 broker。
    # 宿主端口与容器端口不一致时，客户端拿到的是容器内的端口号，连不上。
    # 10909 是 VIP 通道，10912 是 HA 通道（listenPort+1 / +2，由 broker 自己算）
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"

  # 建 Topic。broker.conf 里 autoCreateTopicEnable = false，不建就发不出消息，
  # 而症状是发送报 "topic not exist" 或消息进了默认 8 队列的自动 Topic。
  #
  # 以前这一步是让人手动 docker exec 跑一次脚本，属于"文档里写了但一定有人忘"
  # 的那类步骤——忘了之后所有秒杀都停在"排队中"，而 broker 一句错都不报。
  # 做成一次性服务由 compose 保证它跑过，应用再用
  # depends_on: service_completed_successfully 等它。
  rocketmq-init:
    image: apache/rocketmq:5.3.0
    container_name: fss-rmq-init
    profiles: ["phase3", "all"]
    depends_on:
      - rocketmq-broker
    environment:
      JAVA_OPT_EXT: "-Xms64m -Xmx256m -Xmn64m"
      NAMESRV: rocketmq-namesrv:9876
    volumes:
      - ./docker/rocketmq/init-topics.sh:/init-topics.sh:ro
    restart: "no"
    # 等待与重试都在脚本里，因为 mqadmin updateTopic <b>失败时也返回 0</b>：
    # 在 compose 这层写 `脚本 && exit 0 || 重试` 拦不住它，实测过一次
    # 前三个 Topic 全失败而脚本退出码 0，应用照常启动然后所有秒杀卡在
    # "排队中"。脚本改成回读 topicList 校验，见 init-topics.sh 的头注释
    command: sh /init-topics.sh

  # ==================================================================
  # 阶段四：监控栈
  # ==================================================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fss-prometheus
    profiles: ["phase4", "all"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 演示环境保 7 天够了。秒杀活动本身只有几十分钟，
      # 需要长期留存的是压测报告里的截图，不是原始数据
      - --storage.tsdb.retention.time=7d
      # 开热加载：改了 alert-rules.yml 之后 curl -XPOST /-/reload 即可，
      # 不必重启容器（重启会丢掉内存里还没落盘的样本）
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    # Linux 上 host.docker.internal 默认不存在（那是 Docker Desktop 的特性），
    # 加这一行让 prometheus.yml 里的 target 在两种平台上都能解析到宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fss-grafana
    profiles: ["phase4", "all"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 演示环境免登录直接看图。生产绝不能开——它等于把看板公开，
      # 而看板上有活动名称、库存量、订单量这些业务数据
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 打开后直接落到总览看板，省掉演示时的两次点击
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fss-overview.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  # ==================================================================
  # 一键演示：应用与前端也进容器（profile all）
  #
  # 应用只起一个容器、同时激活 web + consumer + job 三个角色。真实部署要拆
  # （docs/08 的拓扑是 web×3 + consumer×2 + job×1），但拆开演示要开六个终端看日志，
  # 而这个项目要演示的是链路而不是部署形态。要看多实例的行为用 phase5 那套。
  # ==================================================================

  app:
    build:
      # 上下文是仓库根目录：应用镜像要编译全部五个模块
      context: .
      dockerfile: fss-app/Dockerfile
    image: fss-app:local
    container_name: fss-app
    profiles: ["all"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 等 Topic 真的建好再启动。不等的话消费者会订阅一个不存在的 Topic，
      # 之后即使 Topic 建好了，这一轮的订阅关系也已经错了
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      # consumer 必须激活：阶段三起订单由消费端创建，不激活所有秒杀都停在"排队中"。
      # job 决定对账、降级监控、关单扫描跑不跑。dev 建演示数据并开放 mock-sign
      # 默认与加哨兵之前完全一致。要让容器里的应用也走哨兵：
      #   FSS_SPRING_PROFILES=web,consumer,job,dev,sentinel \
      #       docker compose --profile all --profile sentinel up -d
      # 不能把 sentinel 写死在这里——默认那套是 redis 单机，
      # 写死之后默认演示反而会去找哨兵然后连不上。
      # 哨兵节点不用在这里注入：application-sentinel.yml 的默认值就是
      # 容器名形式，与本节其余通告地址一致
      SPRING_PROFILES_ACTIVE: "${FSS_SPRING_PROFILES:-web,consumer,job,dev}"
      # 必须显式指定：application-job.yml 里设了 8099、consumer 设了 8090，
      # profile 顺序靠后的会覆盖前面的。环境变量优先级高于两者
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/flash_sale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      FSS_REDIS_HOST: redis
      FSS_REDIS_PORT: 6379
      FSS_MQ_NAMESRV: rocketmq-namesrv:9876
      # 演示环境用默认弱密钥。生产必须由外部注入，见 application.yml 的注释
      FSS_JWT_SECRET: fss-local-dev-only-secret-change-me-in-prod
      FSS_PAY_SECRET: fss-mock-pay-secret-change-me-in-prod
      TZ: Asia/Shanghai
    ports:
      # 端口留在宿主机上不只是为了 curl 调试：prometheus.yml 抓的是
      # host.docker.internal:8080，靠这个映射在"应用在容器里"和
      # "应用在宿主机上"两种形态下都能命中同一个 target
      - "8080:8080"
    stop_grace_period: 30s

  ui:
    build:
      context: ./fss-web
    image: fss-ui:local
    container_name: fss-ui
    profiles: ["all"]
    depends_on:
      app:
        condition: service_started
    # 8081 而不是 5173：5173 留给 npm run dev。改前端时常见的用法是
    # 容器里跑后端、宿主机跑 Vite 热更新，两个端口不撞才能同时开着
    ports:
      - "8081:80"

  # 四级限流的第一级。只在多实例部署形态下才有意义（它要 proxy_pass 到
  # fss-web-1 / fss-web-2 两个容器），本地开发时应用跑在宿主机上，
  # 所以放在 phase5 profile 里默认不启动。配置本身见 docker/nginx/nginx.conf
  #
  # 注意它 upstream 里的 fss-web-1/2 指的是<b>应用的 web 角色实例</b>，
  # 和前端模块 fss-web/ 没有关系——前端容器叫 fss-ui
  nginx:
    image: nginx:1.27-alpine
    container_name: fss-nginx
    profiles: ["phase5"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
