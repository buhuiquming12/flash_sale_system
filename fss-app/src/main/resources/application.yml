server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
  shutdown: graceful

spring:
  application:
    name: fss
  profiles:
    # 默认本地开发：web + job 一把起，dev 打开模拟支付辅助接口
    default: web,job,dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      # 快速失败，不让请求堆在获取连接上——堆积会让线程池耗尽，
      # 表现为整个应用无响应而不是单个接口变慢
      connection-timeout: 3000
      max-lifetime: 1740000
      pool-name: fss-hikari
  data:
    redis:
      host: ${FSS_REDIS_HOST:127.0.0.1}
      port: ${FSS_REDIS_PORT:6379}
      database: 0
      # 秒杀链路上的 Redis 调用必须快速失败。超时给得长（比如 5s）时，
      # Redis 一慢，Tomcat 线程全部堆在等 Redis 上，表现是整个应用无响应，
      # 而不是"秒杀接口变慢"——故障范围被放大了
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          # Lettuce 是单连接多路复用，池子主要给阻塞型命令和事务用，不必很大
          max-active: 64
          max-idle: 16
          min-idle: 8
          max-wait: 1000ms
        shutdown-timeout: 200ms
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # 默认是 1。阶段四之前只有几个互不重叠的 cron 任务，1 个线程够用；
      # 现在多了 DegradeSwitch 每秒刷新一次开关，而它和"扫描关单"共用这个池——
      # 单线程下一轮扫了 3 分钟的关单任务会让降级开关整整 3 分钟不更新，
      # 恰好是最需要它更新的时候。给 4 个线程让快慢任务互不阻塞
      pool:
        size: 4
      thread-name-prefix: fss-sched-

# ---------------------------------------------------------------------
# RocketMQ。
#
# name-server 与 producer.group 是<b>所有角色</b>都要的：web 角色发消息，
# consumer 角色发补偿消息，job 角色重发消息。没有一个角色是纯消费者。
#
# 注意 rocketmq-spring 的自动装配条件是「配了 name-server 且配了 producer.group」，
# 少一个就不会创建 RocketMQTemplate，而症状是启动时报
# "No qualifying bean of type RocketMQTemplate" —— 不会提示你少配了什么。
# ---------------------------------------------------------------------
rocketmq:
  name-server: ${FSS_MQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: PID_FSS_PRODUCER
    # 与 fss.mq.send-timeout 保持一致。给短是因为秒杀链路上的发送在请求线程里，
    # 超时给长了 Tomcat 线程会堆在等 broker 上——和 Redis 超时一样的道理
    send-message-timeout: 2000
    # 发送失败时客户端自己重试的次数。给 1 而不是默认的 2：
    # 真正的重试兜底是本地消息表 + 重发任务，客户端在请求线程里多重试一次
    # 只会让接口 RT 翻倍。快速失败交给重发任务更好
    retry-times-when-send-failed: 1
    # 4MB 以下不压缩。消息体只有几个 ID，压缩纯属浪费 CPU
    compress-message-body-threshold: 4096
  consumer:
    # 一次 pull 拉多少条。与 consumeThreadNumber 配合决定单实例吞吐
    pull-batch-size: 16

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除未启用：订单、库存流水都必须物理保留，做审计与对账的依据

management:
  # /actuator/prometheus 由 micrometer-registry-prometheus 注册。
  # 只在 include 里写 prometheus 而没有那个依赖时，端点是 404 且不报错
  metrics:
    tags:
      application: fss
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.fss: INFO

# ---------------------------------------------------------------------
# 业务配置。全部绑定到 FssProperties，不散落在代码里——
# 超时时长、限流阈值需要在压测中反复调整，硬编码意味着每次都要重新编译。
# ---------------------------------------------------------------------
fss:
  order:
    pay-timeout: 15m            # 决策 3：关单时长，不受 MQ 延迟级别约束
    close-scan-delay: 2m        # 扫描比过期时刻晚这么久才处理
    close-scan-batch: 200
  seckill:
    result-ttl: 30m
    token-ttl: 5m
    warmup-ahead: 5m
    cache-ttl: 2h
    cache-ttl-jitter: 10m
    null-cache-ttl: 60s
    cache-physical-buffer: 30m    # 物理 TTL 相对逻辑过期的缓冲，保证旧值可读
    key-ttl-after-end: 1h         # 活动结束后 Redis key 再留多久（供轮询与对账）
    released-ttl: 25h             # 已回补订单号 Set 的 TTL，必须覆盖活动结束后的关单
    allow-repurchase-after-cancel: false   # 决策 1，启动时断言必须为 false
  ratelimit:
    enabled: true
    user-qps: 2
    ip-qps: 20
    activity-qps: 5000
    global-qps: 12000
    result-qps: 5
    burst-factor: 2               # 桶容量 = qps × 该倍数，容纳正常的双击与刷新
  sentinel:
    enabled: true
    submit-qps: 6000              # 单实例阈值，3 个 web 实例总量是它的 3 倍
    result-qps: 8000
    activity-detail-qps: 3000
    lua-concurrency: 200          # 用并发线程数而非 QPS，见 SentinelConfig 注释
    slow-rt-ms: 200
    circuit-break-seconds: 10
  mq:
    topic:
      order-create: FSS_ORDER_CREATE
      order-close: FSS_ORDER_CLOSE
      stock-release: FSS_STOCK_RELEASE
      stock-rollback: FSS_STOCK_ROLLBACK
    group:
      order-create: GID_FSS_ORDER_CREATE
      order-close: GID_FSS_ORDER_CLOSE
      stock-release: GID_FSS_STOCK_RELEASE
      stock-rollback: GID_FSS_STOCK_ROLLBACK
    send-timeout: 2000
    max-resend: 5
    # 启动 DefaultMQAdminExt 采集积压量。它是一个额外的 MQ 客户端，
    # broker 不可达时会每轮刷一条连接失败日志，所以默认值是 false，这里显式打开
    backlog-monitor-enabled: true
  degrade:
    seckill-enabled: true         # 人工总闸。与自动降级是"与"关系，自动只能收紧
    refresh-delay-ms: 1000        # 本地缓存刷新间隔，开关最多延迟这么久生效
    level-ttl-seconds: 300        # 自动降级值的 TTL；写入者崩溃时能自己过期
    # 下发给客户端的轮询间隔。Level 2 起换成 degraded 那个值，不用发版
    poll-interval-ms: 300
    degraded-poll-interval-ms: 2000
    auto-enabled: true
    backlog-threshold: 50000      # 积压超阈值 → Level 3（暂停新资格分配）
    stalled-rounds: 4             # 消费端连续 4 轮无进展且仍有积压 → Level 3
    db-pending-threshold: 5       # 连接池等待线程超阈值 → Level 2
    recover-ratio: 0.5            # 恢复阈值 = 触发阈值 × 该比例（滞回，防抖动）
  reconcile:
    orphan-after: 5m              # 排队中超过这么久还没结论才算孤儿
    orphan-rounds-before-rollback: 3
    payment-diff-after: 5m        # 给正常的回调延迟留窗口
    batch-size: 500
    uncertain-retention: 10m      # 超期仍无法判定 → 转人工（不自动回补，方向未知）
    uncertain-settle: 5s          # 静置窗口：超时那一刻脚本可能正在执行
  jwt:
    # 生产必须由环境变量 FSS_JWT_SECRET 注入
    secret: ${FSS_JWT_SECRET:fss-local-dev-only-secret-change-me-in-prod}
    ttl: 2h
    issuer: fss
  pay:
    notify-secret: ${FSS_PAY_SECRET:fss-mock-pay-secret-change-me}
    notify-tolerance: 5m
  job:
    close-expired-cron: "0 */2 * * * ?"
    activity-state-cron: "0 * * * * ?"
    warmup-cron: "0 * * * * ?"
    # 预热并发度。活动之间无依赖，串行会让"到点还没预热完"的风险随活动数
    # 线性放大；但预热与其它 job 共用 job 角色的 DB 连接池（10），
    # 开太大反而抢连接。4 是折中，见 FssProperties.Job 的注释
    warmup-concurrency: 4
    mq-resend-delay-ms: 30000
    # 三类对账的频率不同是刻意的：资格对账最频繁（用户正在等），
    # 库存对账最贵（SCAN + 多次 DB），支付对账最不急但最严重。见 ReconcileJob 注释
    reconcile-qualification-cron: "0 * * * * ?"
    reconcile-stock-cron: "0 */5 * * * ?"
    reconcile-payment-cron: "0 */10 * * * ?"
    uncertain-check-delay-ms: 10000
    # 必须明显小于 fss.degrade.level-ttl-seconds，否则自动降级值会在两轮之间过期抖动
    degrade-monitor-delay-ms: 15000
