# ===================================================================
# 压测 profile —— 只在跑 JMeter 时激活，不激活时对系统零影响。
#
# 为什么需要它：单机压测时 JMeter 与应用在同一台机器上，
# **所有请求的来源 IP 都是 127.0.0.1**。默认 ip-qps=20（burst ×2 = 40），
# 于是压到 40 QPS 之后全部返回 429 —— 测出来的是限流器的行为，
# 不是被测系统的容量。这不是"限流配错了"，恰恰是它按设计工作：
# 真实环境里 10000 QPS 来自成千上万个不同 IP，每个 IP 都远在 20 QPS 以下。
#
# 所以压测分成两组，口径分开：
#   S1-S6  激活本 profile，关掉 IP/用户桶 → 测系统真实容量（P99 / TPS / 错误率）
#   S7     用默认配置        → 验证限流真的生效（429 比例与阈值吻合）
#
# **只关掉"被压测机身份单一"这个前提所影响的那两层**，其余防护全部保留：
#   · Sentinel 接口级 QPS 与熔断      —— 保留（它按接口而非 IP 计数，不受影响）
#   · Lua 内的库存判定与售罄快速失败  —— 保留（正确性核心，关掉就没意义了）
#   · 活动维度桶 activity-qps=5000    —— 保留（跨 IP 的总量控制，压测正该撞它）
#   · 一人一单、幂等三层              —— 保留
# ===================================================================

fss:
  ratelimit:
    # 关掉整个拦截器（IP 桶 + 用户桶 + 活动桶都在这一层）。
    #
    # 只调高 ip-qps 而保留 enabled=true 也能达到目的，但那样每个请求仍要多
    # 3 次 Redis 往返（IP / 用户 / 活动各一次），而压测恰恰在测 RT ——
    # 把测量工具本身的开销算进被测对象是没意义的。
    # activity-qps 的验证交给 S7 那组。
    enabled: false

  # 降级监控在压测时会看到真实的积压与连接池等待，可能自动降级到 Level 2/3，
  # 那会改变被测行为（pollAfterMs 变 2000ms、Level 3 直接拒绝秒杀），
  # 压测数据就成了"降级后的数据"。压测要测的是**未降级时的容量**，
  # 所以关掉自动降级 —— 但 DegradeSwitch 本身保留，手动降级仍可用（F 类演练要用）。
  degrade:
    auto-enabled: false

  job:
    # 压测期间对账任务照常跑（它们本来就该在负载下工作），
    # 只把库存对账拉稀一点：它要 SCAN 整个 keyspace，
    # 而压测会造出几十万个 req key，一轮 SCAN 的成本与总 key 数成正比。
    # 不拉稀的话对账自己会成为一个稳定的负载源，污染 P99。
    reconcile-stock-cron: "0 */30 * * * ?"

logging:
  level:
    # 压测时日志必须收紧。每条秒杀提交都会 log.info 一行，
    # 10000 QPS 下同步 appender 的磁盘 IO 会直接成为瓶颈 ——
    # 压出来的 P99 里有很大一块是在等日志落盘。
    com.fss: WARN
    root: WARN

management:
  endpoints:
    web:
      exposure:
        # 压测时要抓指标，必须保留 prometheus 端点
        include: health,info,prometheus,metrics
