# =====================================================================
# 集成测试用的 broker 配置。
#
# 与 docker/rocketmq/broker.conf 的三处刻意不同：
#
# 1. 端口错开（10921 而非 10911，namesrv 9877 而非 9876）。
#    broker 会把 brokerIP1:listenPort 注册到 namesrv，客户端拿到这个地址后直连，
#    所以宿主端口必须与容器端口一致 —— 也就没法让 Testcontainers 随机分配。
#    错开端口是为了让 mvn verify 和 docker compose 的那套 MQ 能同时活着，
#    否则每次跑测试都要先把联调环境停掉。
#
# 2. autoCreateTopicEnable = true。测试不跑 mqadmin 建 Topic：
#    那要多花十几秒，而队列数对正确性没有影响。代价是拼错的 Topic 名会被静默创建，
#    这一层由 MqTopicConsistencyTest 在代码层面兜住（常量 vs 配置项逐个比对）。
#
# 3. 更小的 CommitLog（1MB 而非 1GB）。容器启动时要预分配这个文件，
#    1GB 在开发机上要几秒并占掉磁盘，测试的消息量用 1MB 完全够。
# =====================================================================
brokerClusterName = DefaultCluster
brokerName = broker-test
brokerId = 0
# 注册给客户端的地址。客户端（宿主机上的测试进程）从 namesrv 查到它之后<b>直连</b>，
# 所以必须是宿主机可达的地址 + 与容器端口一致的宿主端口
brokerIP1 = 127.0.0.1
listenPort = 10921
# 用网络别名而不是 127.0.0.1：broker 与 namesrv 是两个独立容器，
# 各自发布自己的端口。用户自定义 bridge 网络里有 DNS，别名解析得到
namesrvAddr = mq-namesrv:9876
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 决策 3 的前提。关掉它 syncSendDeliverTimeMills 不报错但会立刻投递，
# 关单测试会变成"下单即关单"却查不出原因
timerWheelEnable = true

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
defaultTopicQueueNums = 4

mappedFileSizeCommitLog = 1048576
mappedFileSizeConsumeQueue = 30000
# 开发机磁盘常年 90% 以上。默认 85% 起就拒写，
# 症状是所有发送返回 SERVICE_NOT_AVAILABLE 而报错完全看不出是水位问题
diskMaxUsedSpaceRatio = 98
fileReservedTime = 1
